<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafezin com Prefeitura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F1F1; color: #2D3436; }
        .sidebar { background: #FFFFFF; border-right: 1px solid #E5E7EB; }
        .btn-primary { background: #D69090; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { background: #C07B7B; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(214, 144, 144, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .input-field { background: #FDFDFD; border: 1px solid #E2E8F0; transition: all 0.2s; }
        .input-field:focus { border-color: #D69090; box-shadow: 0 0 0 3px rgba(214, 144, 144, 0.1); outline: none; }
        .step-inactive { color: #CBD5E1; }
        .step-active { color: #D69090; font-weight: 700; }
        .progress-line { height: 2px; background: #E2E8F0; position: relative; }
        .progress-fill { height: 100%; background: #D69090; transition: width 0.4s ease; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 sidebar hidden md:flex flex-col p-6 gap-8">
        <div class="flex items-center gap-3 px-2">
            <div class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center text-xl shadow-lg">☕</div>
            <span class="font-bold text-sm leading-tight text-slate-800 uppercase tracking-tighter">Cafezin com<br><span class="text-[#D69090]">Prefeitura</span></span>
        </div>
        
        <nav class="flex flex-col gap-2">
            <button onclick="location.reload()" class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl text-sm font-semibold text-slate-900">
                <span>📊</span> Painel Geral
            </button>
            <button onclick="novaSolicitacao()" class="flex items-center gap-3 p-3 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold transition">
                <span>➕</span> Nova Solicitação
            </button>
            <div class="h-[1px] bg-slate-100 my-2"></div>
            <button class="flex items-center gap-3 p-3 text-slate-400 text-sm font-medium italic">Em breve: Relatórios</button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Solicitações em Destaque</h1>
                <p class="text-slate-500">Gerenciamento de treinamentos e cotações</p>
            </div>
            <button onclick="novaSolicitacao()" class="btn-primary text-white px-6 py-3 rounded-2xl font-bold text-sm">
                Criar Treinamento
            </button>
        </header>

        <div id="lista-treinamentos" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>

    </main>

    <div id="modal-form" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md hidden flex items-center justify-end z-50">
        <div class="bg-white w-full max-w-lg h-full shadow-2xl animate-in slide-in-from-right duration-300 flex flex-col">
            
            <div class="p-8 border-b flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800" id="modal-id">Nova Solicitação</h2>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-widest mt-1">Cadastro de Treinamento</p>
                </div>
                <button onclick="fecharModal()" class="w-10 h-10 rounded-full hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <div class="px-8 pt-6">
                <div class="flex justify-between mb-2">
                    <span id="label-1" class="text-[10px] uppercase tracking-tighter step-active">1. Solicitação</span>
                    <span id="label-2" class="text-[10px] uppercase tracking-tighter step-inactive">2. Cotação</span>
                    <span id="label-3" class="text-[10px] uppercase tracking-tighter step-inactive">3. Pagamento</span>
                </div>
                <div class="progress-line rounded-full">
                    <div id="progress-bar" class="progress-fill rounded-full w-[15%]"></div>
                </div>
            </div>

            <div class="p-8 flex-1 overflow-y-auto space-y-6">
                
                <div id="step-1" class="step-content space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Nome da Cidade</label>
                        <input type="text" id="cidade" placeholder="Ex: Mundo Novo" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Quantidade de Pessoas</label>
                        <input type="number" id="pessoas" placeholder="150" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Responsável / Instrutor</label>
                        <input type="text" id="instrutor" placeholder="Nome do responsável" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Data e Hora</label>
                        <input type="datetime-local" id="data_hora" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                </div>

                <div id="step-2" class="step-content hidden space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Fornecedor Escolhido</label>
                        <input type="text" id="fornecedor" placeholder="Nome da empresa" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Valor do Treinamento (R$)</label>
                        <input type="number" id="valor" placeholder="0.00" class="w-full input-field p-4 rounded-2xl mt-1">
                    </div>
                    <div class="p-8 border-2 border-dashed border-slate-100 rounded-3xl bg-slate-50 text-center">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-3">Anexar 3 Prints de Cotação</p>
                        <input type="file" id="prints" multiple class="text-xs">
                    </div>
                </div>

                <div id="step-3" class="step-content hidden space-y-4">
                    <div class="bg-[#FDF2F2] p-6 rounded-3xl border border-[#D69090]/20 text-center">
                        <p class="text-sm font-semibold text-[#D69090]">Aguardando Comprovante</p>
                        <p class="text-xs text-slate-500 mt-1">Suba o print final para encerrar este processo.</p>
                    </div>
                    <input type="file" id="comprovante" class="w-full p-4 border rounded-2xl">
                </div>

            </div>

            <div class="p-8 border-t bg-slate-50 flex justify-between items-center">
                <button id="btn-voltar" onclick="voltar()" class="text-xs font-bold text-slate-400 hover:text-slate-600 hidden uppercase">Voltar</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="salvarAtual()" class="px-6 py-3 text-slate-500 font-bold text-xs uppercase hover:bg-slate-100 rounded-xl transition">Salvar</button>
                    <button id="btn-proximo" onclick="proximo()" class="btn-primary text-white px-8 py-3 rounded-xl font-bold text-xs uppercase shadow-lg">Próximo</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('cafezin_v3')) || [];
        let editandoId = null;
        let etapaAtual = 1;

        function renderizarDashboard() {
            const lista = document.getElementById('lista-treinamentos');
            lista.innerHTML = '';
            
            db.forEach(item => {
                lista.innerHTML += `
                    <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100 flex flex-col justify-between h-56 hover:shadow-xl hover:shadow-slate-200/50 transition-all duration-300">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                <span>ID: ${item.id}</span>
                                <span class="bg-slate-50 px-3 py-1 rounded-full ${item.status === 'FINALIZADO' ? 'text-green-500' : 'text-[#D69090]'}">${item.status}</span>
                            </div>
                            <div>
                                <h3 class="text-xl font-extrabold text-slate-800 leading-tight">${item.cidade || '---'}</h3>
                                <p class="text-xs font-medium text-slate-400 mt-1">Responsável: <span class="text-slate-600">${item.instrutor || 'Não definido'}</span></p>
                            </div>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[10px] font-bold text-slate-300 uppercase">Data Prevista</p>
                                <p class="text-xs font-bold text-slate-700">${item.data_hora ? item.data_hora.replace('T', ' ') : '---'}</p>
                            </div>
                            <button onclick="abrirSolicitacao('${item.id}')" class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white text-lg hover:scale-105 transition active:scale-95">➜</button>
                        </div>
                    </div>
                `;
            });
        }

        function novaSolicitacao() {
            editandoId = 'CF-' + Math.floor(Math.random() * 9999);
            etapaAtual = 1;
            limparForm();
            abrirModal();
        }

        function abrirSolicitacao(id) {
            const item = db.find(t => t.id === id);
            editandoId = id;
            etapaAtual = item.etapa;
            document.getElementById('cidade').value = item.cidade;
            document.getElementById('pessoas').value = item.pessoas;
            document.getElementById('instrutor').value = item.instrutor;
            document.getElementById('data_hora').value = item.data_hora;
            document.getElementById('fornecedor').value = item.fornecedor;
            document.getElementById('valor').value = item.valor;
            abrirModal();
        }

        function proximo() {
            if (etapaAtual < 3) {
                etapaAtual++;
                atualizarInterfaceModal();
            } else {
                finalizarSolicitacao();
            }
        }

        function voltar() {
            if (etapaAtual > 1) {
                etapaAtual--;
                atualizarInterfaceModal();
            }
        }

        function atualizarInterfaceModal() {
            document.querySelectorAll('.step-content').forEach((s, i) => s.classList.toggle('hidden', i + 1 !== etapaAtual));
            
            const pct = etapaAtual === 1 ? '15%' : (etapaAtual === 2 ? '50%' : '100%');
            document.getElementById('progress-bar').style.width = pct;

            document.getElementById('label-1').className = `text-[10px] uppercase tracking-tighter ${etapaAtual >= 1 ? 'step-active' : 'step-inactive'}`;
            document.getElementById('label-2').className = `text-[10px] uppercase tracking-tighter ${etapaAtual >= 2 ? 'step-active' : 'step-inactive'}`;
            document.getElementById('label-3').className = `text-[10px] uppercase tracking-tighter ${etapaAtual >= 3 ? 'step-active' : 'step-inactive'}`;

            document.getElementById('btn-voltar').classList.toggle('hidden', etapaAtual === 1);
            document.getElementById('btn-proximo').innerText = etapaAtual === 3 ? 'Finalizar' : 'Próximo';
            document.getElementById('modal-id').innerText = editandoId;
        }

        function salvarAtual() {
            const index = db.findIndex(t => t.id === editandoId);
            const dados = {
                id: editandoId,
                etapa: etapaAtual,
                status: etapaAtual === 3 ? 'PAGAMENTO' : (etapaAtual === 2 ? 'COTAÇÃO' : 'ABERTO'),
                cidade: document.getElementById('cidade').value,
                pessoas: document.getElementById('pessoas').value,
                instrutor: document.getElementById('instrutor').value,
                data_hora: document.getElementById('data_hora').value,
                fornecedor: document.getElementById('fornecedor').value,
                valor: document.getElementById('valor').value
            };

            if (index > -1) db[index] = dados;
            else db.push(dados);

            localStorage.setItem('cafezin_v3', JSON.stringify(db));
            fecharModal();
            renderizarDashboard();
        }

        function finalizarSolicitacao() {
            const index = db.findIndex(t => t.id === editandoId);
            db[index].status = 'FINALIZADO';
            db[index].etapa = 3;
            localStorage.setItem('cafezin_v3', JSON.stringify(db));
            alert("✨ Treinamento Finalizado com Sucesso!");
            fecharModal();
            renderizarDashboard();
        }

        function abrirModal() { document.getElementById('modal-form').classList.remove('hidden'); atualizarInterfaceModal(); }
        function fecharModal() { document.getElementById('modal-form').classList.add('hidden'); }
        function limparForm() { document.querySelectorAll('input').forEach(i => i.value = ''); }

        renderizarDashboard();
    </script>
</body>
</html>
